<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-label="쑝이 캐릭터: 동그란 아기 새">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mouth{transform-box:view-box;transform-origin:150px 160px;animation:talk 6s infinite}
@keyframes talk{0%{transform:scaleY(.08)}5%{transform:scaleY(1)}9%{transform:scaleY(.15)}13%{transform:scaleY(1)}17%{transform:scaleY(.15)}21%{transform:scaleY(1)}25%{transform:scaleY(.15)}29%{transform:scaleY(1)}33%{transform:scaleY(.15)}37%{transform:scaleY(1)}41%{transform:scaleY(.15)}45%{transform:scaleY(1)}49%{transform:scaleY(.15)}53%{transform:scaleY(1)}57%{transform:scaleY(.15)}61%{transform:scaleY(1)}65%{transform:scaleY(.15)}70%{transform:scaleY(.08)}100%{transform:scaleY(.08)}}
.wl{transform-origin:84px 140px;animation:wingL 1.8s ease-in-out infinite alternate}
.wr{transform-origin:216px 140px;animation:wingR 1.8s ease-in-out infinite alternate}
@keyframes wingL{from{transform:rotate(0)}to{transform:rotate(9deg)}}
@keyframes wingR{from{transform:rotate(0)}to{transform:rotate(-9deg)}}
@media (prefers-reduced-motion:reduce){.eyes,.mouth,.wl,.wr{animation:none}.mouth{transform:scaleY(.08)}}
</style>
