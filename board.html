<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전체 게시글 · 쑝이놀이터</title>
  <meta name="description" content="쑝이놀이터 게시판의 모든 글을 모아 봤어요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&family=Poppins:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=81">
</head>
<body>

  <!-- 맨 위 메뉴 (홈과 같은 모양): 로고와 홈으로 가는 링크 -->
  <header class="nav">
    <a class="logo" href="index.html" aria-label="쑝이놀이터 홈으로">쑝이놀이터</a>
    <nav class="menu" aria-label="주 메뉴">
      <a href="index.html">← 홈으로</a>
      <a href="news.html">소식</a>
      <button class="login-btn" id="loginBtn" type="button">로그인</button>
    </nav>
  </header>

  <main>
    <!-- 전체 게시글: 홈의 BOARD는 최근 5개만 보여서, 나머지는 여기서 봄 -->
    <section class="section news-page">
      <div class="wrap">
        <div class="head">
          <div>
            <h2 class="en-title">BOARD</h2>
            <span class="pill-tag">전체 게시글</span><small class="board-count" id="postCount"></small>
          </div>
          <a class="more" href="index.html#board" aria-label="홈으로 돌아가기">←</a>
        </div>
        <!-- 글쓰기 칸: 구글 로그인하면 boardpage.js가 보여 줌 (욕 · 비방은 올릴 수 없음) -->
        <form class="post-form" id="postForm" hidden>
          <span class="pill-tag form-tag">글쓰기</span>
          <input id="postTitle" type="text" maxlength="80" placeholder="제목" required aria-label="제목">
          <textarea id="postBody" maxlength="1000" rows="4" placeholder="쑝이와 친구들에게 하고 싶은 말을 남겨 주세요. 욕이나 비방은 올릴 수 없어요." required aria-label="내용"></textarea>
          <div class="post-form-foot">
            <small id="postWho"></small>
            <button class="btn dark" type="submit">글 올리기</button>
          </div>
        </form>
        <!-- 로그인 안내: 로그인 전에 보임 -->
        <p class="board-login" id="boardLogin">글을 쓰려면 <button class="link-btn" id="boardLoginBtn" type="button">구글로 로그인</button>해 주세요. 읽기는 로그인 없이 가능해요.</p>
        <!-- boardpage.js가 이 안을 글로 채움 -->
        <ul class="post-list" id="postList" aria-live="polite">
          <li class="post-empty">게시글을 불러오는 중이에요…</li>
        </ul>
      </div>
    </section>
  </main>

  <script type="module" src="boardpage.js?v=2"></script>
</body>
</html>
