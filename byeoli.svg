<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-label="별이 캐릭터: 갈색 고양이">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s -2s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box;transform-origin:50% 0;animation:talk 6s -1s infinite}
@keyframes talk{0%{transform:scaleY(.05)}5%{transform:scaleY(1)}9%{transform:scaleY(.2)}13%{transform:scaleY(1)}17%{transform:scaleY(.2)}21%{transform:scaleY(1)}25%{transform:scaleY(.2)}29%{transform:scaleY(1)}33%{transform:scaleY(.2)}37%{transform:scaleY(1)}41%{transform:scaleY(.2)}45%{transform:scaleY(1)}49%{transform:scaleY(.2)}53%{transform:scaleY(1)}57%{transform:scaleY(.2)}61%{transform:scaleY(1)}65%{transform:scaleY(.2)}70%{transform:scaleY(.05)}100%{transform:scaleY(.05)}}
.tail{transform-box:view-box;transform-origin:236px 230px;animation:wag 1.2s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.eyes,.mouth,.eL,.eR,.tail{animation:none}.mouth{transform:scaleY(.05)}}
