<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-label="송이 캐릭터: 구름무늬 옷을 입은 양">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.2s -1s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box;transform-origin:50% 0;animation:talk 6s -2s infinite}
@keyframes talk{0%{transform:scaleY(.05)}5%{transform:scaleY(1)}9%{transform:scaleY(.2)}13%{transform:scaleY(1)}17%{transform:scaleY(.2)}21%{transform:scaleY(1)}25%{transform:scaleY(.2)}29%{transform:scaleY(1)}33%{transform:scaleY(.2)}37%{transform:scaleY(1)}41%{transform:scaleY(.2)}45%{transform:scaleY(1)}50%{transform:scaleY(.05)}100%{transform:scaleY(.05)}}
.eL{transform-box:view-box;transform-origin:100px 112px;animation:earL 2.2s ease-in-out infinite alternate}
.eR{transform-box:view-box;transform-origin:200px 112px;animation:earR 2.6s ease-in-out infinite alternate}
@keyframes earL{from{transform:rotate(8deg)}to{transform:rotate(22deg)}}
@keyframes earR{from{transform:rotate(-8deg)}to{transform:rotate(-22deg)}}
.tail{transform-box:fill-box;transform-origin:50% 50%;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:scale(1)}to{transform:scale(1.15)}}
@media (prefers-reduced-motion:reduce){.eyes,.mouth,.eL,.eR,.tail{animation:none}.mouth{transform:scaleY(.05)}}
