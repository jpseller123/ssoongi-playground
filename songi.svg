<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 290" role="img" aria-label="송이 캐릭터: 하얀 털에 까만 얼굴의 아기 양">
<style>
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.5s -3s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
.mouth{transform-box:fill-box;transform-origin:50% 0;animation:talk 6s -4s infinite}
@keyframes talk{0%{transform:scaleY(.05)}5%{transform:scaleY(1)}9%{transform:scaleY(.2)}13%{transform:scaleY(1)}17%{transform:scaleY(.2)}21%{transform:scaleY(1)}25%{transform:scaleY(.2)}29%{transform:scaleY(1)}33%{transform:scaleY(.2)}37%{transform:scaleY(1)}41%{transform:scaleY(.2)}45%{transform:scaleY(1)}49%{transform:scaleY(.2)}53%{transform:scaleY(1)}57%{transform:scaleY(.2)}61%{transform:scaleY(1)}65%{transform:scaleY(.2)}70%{transform:scaleY(.05)}100%{transform:scaleY(.05)}}
.eL{transform-box:view-box;transform-origin:80px 110px;animation:earL 2s ease-in-out infinite alternate}
.eR{transform-box:view-box;transform-origin:220px 110px;animation:earR 2.4s ease-in-out infinite alternate}
@keyframes earL{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes earR{from{transform:rotate(6deg)}to{transform:rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.eyes,.mouth,.eL,.eR,.tail{animation:none}.mouth{transform:scaleY(.05)}}
